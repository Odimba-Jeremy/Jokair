<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialisation du mot de passe — I-Hub</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #f0f9ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card-auth {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(10, 92, 126, 0.12);
    padding: 36px;
    max-width: 440px;
    width: 100%;
    border: 1px solid #bae6fd;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #0a5c7e, #0284c7);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 24px;
    box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
  }
  .card-auth h1 {
    font-size: 22px;
    color: #075985;
    margin: 0 0 8px 0;
    font-weight: 700;
    text-align: center;
  }
  .card-auth p {
    color: #475569;
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
    text-align: center;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #0284c7;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }
  .btn-submit {
    width: 100%;
    background: #0284c7;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: #0369a1; }
  .btn-submit:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 13px;
    display: none;
    line-height: 1.4;
  }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
</style>
</head>
<body>
  <div class="card-auth">
    <div class="brand-header">
      <div class="brand-icon">I+</div>
    </div>
    <h1>Nouveau mot de passe</h1>
    <p>Définissez un mot de passe sécurisé pour accéder à votre compte I-Hub.</p>

    <div id="alertBox" class="alert"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe (min. 8 caractères)</label>
        <input type="password" id="newPassword" required minlength="8" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmez le mot de passe</label>
        <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Valider le nouveau mot de passe</button>
    </form>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const alertBox = document.getElementById('alertBox');

    if (!token) {
      alertBox.className = 'alert alert-error';
      alertBox.textContent = 'Jeton de réinitialisation manquant ou invalide.';
      alertBox.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    }

    async function handleReset(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      if (p1 !== p2) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Les deux mots de passe ne correspondent pas.';
        alertBox.style.display = 'block';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Enregistrement en cours...';

      try {
        const apiUrl = window.location.origin + '/api';
        const res = await fetch(apiUrl + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: p1 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur lors de la réinitialisation');

        alertBox.className = 'alert alert-success';
        alertBox.textContent = data.message || 'Mot de passe modifié avec succès ! Vous pouvez maintenant vous connecter.';
        alertBox.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Valider le nouveau mot de passe';
      }
    }
  </script>
</body>
</html>
