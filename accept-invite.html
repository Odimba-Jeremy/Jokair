<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activation de compte — I-Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --blue-50:  #f0f9ff;
    --blue-100: #e0f2fe;
    --blue-200: #bae6fd;
    --blue-500: #0ea5e9;
    --blue-600: #0284c7;
    --blue-700: #0369a1;
    --blue-800: #075985;
    --blue-900: #0c4a6e;
    --ink:      #0f172a;
    --muted:    #475569;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 600px at 15% 0%,  #dbeefe, transparent 60%),
      radial-gradient(900px  600px at 100% 100%, #e0f2fe, transparent 55%),
      var(--blue-50);
    position: relative;
    overflow: hidden;
  }

  /* Halos décoratifs */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    animation: drift 18s ease-in-out infinite;
  }
  body::before {
    width: 420px; height: 420px;
    background: #7dd3fc;
    top: -160px; left: -120px;
  }
  body::after {
    width: 380px; height: 380px;
    background: #bae6fd;
    bottom: -160px; right: -120px;
    animation-delay: -9s;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0)    scale(1); }
    50%      { transform: translateY(-28px) scale(1.06); }
  }

  .card-auth {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 22px;
    box-shadow:
      0 30px 60px -20px rgba(10, 92, 126, 0.22),
      0 8px 20px -10px rgba(10, 92, 126, 0.12);
    padding: 40px 36px 36px;
    max-width: 460px;
    width: 100%;
    border: 1px solid rgba(186, 230, 253, 0.9);
    animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(22px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  /* Liseré animé en haut */
  .card-auth::before {
    content: "";
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-500), transparent);
    opacity: 0.75;
    animation: shimmer 3.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { transform: translateX(-15%); opacity: 0.4; }
    50%      { transform: translateX(15%);  opacity: 0.9; }
  }

  /* En-tête de marque */
  .brand-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .brand-icon {
    position: relative;
    width: 60px; height: 60px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--blue-800), var(--blue-600));
    border-radius: 16px;
    color: #fff;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.02em;
    box-shadow:
      0 12px 24px -10px rgba(2, 132, 199, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    animation: pop 0.6s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .brand-icon::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 20px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.35), transparent 70%);
    z-index: -1;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.6) rotate(-6deg); }
    to   { opacity: 1; transform: scale(1)   rotate(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);    opacity: 0.6; }
    50%      { transform: scale(1.15); opacity: 0; }
  }

  .card-auth h1 {
    font-size: 22px;
    color: var(--blue-900);
    margin: 0 0 8px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .card-auth p.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 26px;
    line-height: 1.55;
    text-align: center;
  }

  /* Champs */
  .form-group { margin-bottom: 18px; position: relative; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 7px;
  }
  .input-wrap { position: relative; }
  .input-wrap i.lead-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 14px;
    pointer-events: none;
    transition: color 0.2s;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.9);
    color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .form-group input::placeholder { color: #94a3b8; }
  .form-group input:hover { border-color: #94a3b8; }
  .form-group input:focus {
    outline: none;
    border-color: var(--blue-600);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.14);
  }
  .form-group input:focus + i.lead-icon,
  .form-group input:focus ~ i.lead-icon { color: var(--blue-600); }

  /* Bouton œil mot de passe */
  .toggle-pwd {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: 0;
    color: #94a3b8;
    cursor: pointer;
    font-size: 14px;
    padding: 6px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }
  .toggle-pwd:hover { color: var(--blue-700); background: rgba(2, 132, 199, 0.08); }

  /* Indicateur de force */
  .pwd-strength {
    margin-top: 8px;
    height: 5px;
    border-radius: 999px;
    background: #e2e8f0;
    overflow: hidden;
  }
  .pwd-strength span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #ef4444;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .pwd-strength-label {
    font-size: 11px;
    color: #64748b;
    margin-top: 5px;
    display: block;
    min-height: 14px;
  }

  /* Bouton submit */
  .btn-submit {
    width: 100%;
    background: linear-gradient(180deg, var(--blue-600), var(--blue-700));
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    margin-top: 6px;
    box-shadow:
      0 12px 24px -10px rgba(2, 132, 199, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow:
      0 16px 30px -10px rgba(2, 132, 199, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .btn-submit:active:not(:disabled) { transform: translateY(0); }
  .btn-submit:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
    opacity: 0.9;
  }
  .btn-submit .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-submit.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Alertes */
  .alert {
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 13px;
    display: none;
    line-height: 1.45;
    align-items: flex-start;
    gap: 10px;
    animation: alert-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .alert.show { display: flex; }
  .alert i { margin-top: 1px; font-size: 14px; flex-shrink: 0; }
  .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  @keyframes alert-in {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 420px) {
    .card-auth { padding: 32px 22px 28px; border-radius: 18px; }
    .card-auth h1 { font-size: 20px; }
    .brand-icon { width: 54px; height: 54px; font-size: 22px; border-radius: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="card-auth">
    <div class="brand-header">
      <div class="brand-icon">I+</div>
    </div>
    <h1>Activation de votre compte</h1>
    <p class="subtitle">Bienvenue dans l'équipe I-Hub. Complétez votre profil pour activer vos accès sécurisés.</p>

    <div id="alertBox" class="alert"></div>

    <form id="inviteForm" onsubmit="handleAccept(event)" novalidate>
      <div class="form-group">
        <label for="fullName">Votre nom complet</label>
        <div class="input-wrap">
          <input type="text" id="fullName" required placeholder="Ex : Dr. Jean Dupont" autocomplete="name">
          <i class="fas fa-user lead-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">Créer votre mot de passe (min. 8 caractères)</label>
        <div class="input-wrap">
          <input type="password" id="newPassword" required minlength="8" placeholder="••••••••" autocomplete="new-password">
          <i class="fas fa-lock lead-icon"></i>
          <button type="button" class="toggle-pwd" data-target="newPassword" aria-label="Afficher le mot de passe">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="pwd-strength"><span id="strengthBar"></span></div>
        <span class="pwd-strength-label" id="strengthLabel"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmez votre mot de passe</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••" autocomplete="new-password">
          <i class="fas fa-lock lead-icon"></i>
          <button type="button" class="toggle-pwd" data-target="confirmPassword" aria-label="Afficher le mot de passe">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span class="spinner"></span>
        <span class="btn-label">Activer mon compte</span>
      </button>
    </form>
  </div>

<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const alertBox = document.getElementById('alertBox');
  const form = document.getElementById('inviteForm');
  const btn  = document.getElementById('submitBtn');

  function showAlert(type, message, icon) {
    alertBox.className = 'alert alert-' + type + ' show';
    alertBox.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
  }
  function hideAlert() {
    alertBox.className = 'alert';
    alertBox.innerHTML = '';
  }

  if (!token) {
    showAlert('error', "Jeton d'invitation manquant ou expiré.", 'fa-triangle-exclamation');
    form.style.display = 'none';
  }

  /* ---- Toggle eye ---- */
  document.querySelectorAll('.toggle-pwd').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector('i');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
      btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    });
  });

  /* ---- Force du mot de passe ---- */
  const pwdInput = document.getElementById('newPassword');
  const strengthBar = document.getElementById('strengthBar');
  const strengthLabel = document.getElementById('strengthLabel');

  function scorePassword(pwd) {
    let s = 0;
    if (pwd.length >= 8) s++;
    if (pwd.length >= 12) s++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) s++;
    if (/\d/.test(pwd)) s++;
    if (/[^A-Za-z0-9]/.test(pwd)) s++;
    return Math.min(s, 4);
  }
  pwdInput.addEventListener('input', () => {
    const s = scorePassword(pwdInput.value);
    const pct = [0, 25, 50, 75, 100][s];
    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#16a34a'];
    const labels = ['', 'Faible', 'Moyen', 'Bon', 'Excellent'];
    strengthBar.style.width = pct + '%';
    strengthBar.style.background = colors[s];
    strengthLabel.textContent = pwdInput.value ? labels[s] : '';
    strengthLabel.style.color = colors[s];
  });

  /* ---- Soumission ---- */
  async function handleAccept(e) {
    e.preventDefault();
    hideAlert();

    const name = document.getElementById('fullName').value.trim();
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;

    if (!name) return showAlert('error', 'Veuillez saisir votre nom complet.', 'fa-circle-exclamation');
    if (p1.length < 8) return showAlert('error', 'Le mot de passe doit contenir au moins 8 caractères.', 'fa-circle-exclamation');
    if (p1 !== p2) return showAlert('error', 'Les mots de passe ne correspondent pas.', 'fa-circle-exclamation');

    btn.disabled = true;
    btn.classList.add('loading');
    btn.querySelector('.btn-label').textContent = 'Activation en cours…';

    try {
      const apiUrl = window.location.origin + '/api';
      const res = await fetch(apiUrl + '/auth/accept-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, name, password: p1 })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Erreur lors de l'activation");

      showAlert('success', data.message || 'Compte activé avec succès !', 'fa-circle-check');
      form.style.display = 'none';
    } catch (err) {
      showAlert('error', err.message, 'fa-circle-exclamation');
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.querySelector('.btn-label').textContent = 'Activer mon compte';
    }
  }
</script>
</body>
</html>
